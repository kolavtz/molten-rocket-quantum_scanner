name: CI/CD — Production Deploy
run-name: Production Deploy (${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.deploy_ref || github.ref_name }})

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Tag, branch, or commit SHA to deploy to production'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.deploy_ref || github.run_id }}
  cancel-in-progress: false

env:
  DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.deploy_ref }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vi '^llama-cpp-python' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install "PyMySQL>=1.1.1"
      - name: Run unit tests
        run: |
          python -m pytest -q

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.PRODUCTION_DEPLOY_PATH }}"
            DEPLOY_REF="${{ env.DEPLOY_REF }}"
            REPO_URL="${{ secrets.PRODUCTION_REPO_URL }}"

            if [ -z "$REPO_URL" ]; then
              # Fallback keeps compatibility for repositories that haven't defined PRODUCTION_REPO_URL yet.
              # For long-term auto-update on server, prefer PRODUCTION_REPO_URL with SSH auth already configured on server.
              REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            fi

            if [ -z "$DEPLOY_DIR" ]; then
              echo "PRODUCTION_DEPLOY_PATH secret is required. Aborting."
              exit 1
            fi
            DEPLOY_REF=${DEPLOY_REF:-main}
            if ! echo "$DEPLOY_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "Invalid production ref: $DEPLOY_REF"
              exit 1
            fi
            mkdir -p "$DEPLOY_DIR"

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "No git checkout found. Cloning $DEPLOY_REF into $DEPLOY_DIR"
              rm -rf "$DEPLOY_DIR"
              git clone --branch "$DEPLOY_REF" "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            echo "Fetching latest refs from origin..."
            git remote set-url origin "$REPO_URL"
            git fetch --tags --prune origin

            echo "Deploying ref: $DEPLOY_REF"
            git checkout -f "$DEPLOY_REF"

            if git show-ref --verify --quiet "refs/remotes/origin/$DEPLOY_REF"; then
              git reset --hard "origin/$DEPLOY_REF"
            elif git rev-parse -q --verify "refs/tags/$DEPLOY_REF" >/dev/null 2>&1; then
              git checkout -f "refs/tags/$DEPLOY_REF"
            else
              # Commit SHA or detached ref; keep checked-out state.
              echo "Using detached ref $DEPLOY_REF"
            fi

            git clean -fd

            # Strip tokenized remote URL after deploy to avoid persisting ephemeral token in .git/config.
            case "$REPO_URL" in
              https://x-access-token:*)
                git remote set-url origin "https://github.com/${{ github.repository }}.git" || true
                ;;
            esac

            python -m pip install --upgrade pip
            if [ -f "requirements.txt" ]; then
              grep -vi '^llama-cpp-python' requirements.txt > requirements.ci.txt
              pip install -r requirements.ci.txt
              pip install "PyMySQL>=1.1.1"
            fi
            # Restart systemd service (replace 'quantumshield' with your service name)
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl restart quantumshield.service || true
            fi
            # Fallback: Docker Compose
            if [ -f "docker-compose.yml" ] || [ -f "compose.yml" ]; then
              docker-compose pull || true
              docker-compose up -d --build || true
            fi