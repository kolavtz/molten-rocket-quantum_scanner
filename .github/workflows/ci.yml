name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quantumshield
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: quantumshield
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vi '^llama-cpp-python' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install "PyMySQL>=1.1.1"
          pip install bandit pip-audit locust

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot && break
            echo "Waiting for MySQL... ($i/30)"
            sleep 1
          done

      - name: Security scan - bandit
        run: bandit -r web src -x tests,tmp

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Run smoke tests
        run: pytest tests/smoke -q

      - name: Run unit + integration + security + performance tests with coverage
        run: pytest tests/unit tests/integration tests/security tests/performance -q --cov=src --cov=web --cov-report=xml --cov-report=term

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
