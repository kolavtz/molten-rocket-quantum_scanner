[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumshield"
version = "1.0.0"
description = "QuantumShield - a Flask-powered quantum-safe TLS scanning and CBOM platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
  {name = "QuantumShield Contributors"}
]
keywords = ["flask", "security", "tls", "cbom", "cybersecurity", "pqc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: Flask",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
  "Flask>=3.0.0",
  "Werkzeug>=3.0.0",
  "Jinja2>=3.1.0",
  "sslyze>=5.2.0",
  "cryptography>=42.0.0",
  "cffi>=1.16.0",
  "mysql-connector-python>=9.0.0",
  "SQLAlchemy>=2.0.0",
  "Flask-Login>=0.6.3",
  "Flask-WTF>=1.2.1",
  "flask-talisman>=1.1.0",
  "Flask-Limiter>=3.5.0",
  "argon2-cffi>=23.1.0",
  "pyotp>=2.9.0",
  "qrcode>=7.4.2",
  "Pillow>=10.0.0",
  "Flask-Mail>=0.9.1",
  "cyclonedx-python-lib>=7.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "dnspython>=2.6.0",
  "matplotlib>=3.7.0",
  "reportlab>=4.0",
  "MarkupSafe>=2.1.0",
  "itsdangerous>=2.1.0",
  "click>=8.1.0",
  "blinker>=1.7.0",
  "llama-cpp-python>=0.1.80",
  "waitress>=3.0.0; sys_platform == 'win32'",
  "gunicorn>=21.2.0; sys_platform != 'win32'",
  "weasyprint>=62.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
quantumshield = "web.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*", "web*", "middleware*", "utils*"]

[tool.setuptools.package-data]
web = ["templates/**/*.html", "static/**/*", "theme.json"]
src = []
